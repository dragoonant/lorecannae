<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <!-- Original card back for lorecannae: a night-sky storybook pattern (indigo field,
       teal stars, a gold compass-diamond). Drawn geometry, no lettering, no logo. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2b2f6b"/>
      <stop offset=".55" stop-color="#171a44"/>
      <stop offset="1" stop-color="#0b0d24"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".5" stop-color="#e2b44d"/>
      <stop offset="1" stop-color="#9c6f1f"/>
    </linearGradient>
    <pattern id="stars" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M12 6 Q12 12 18 12 Q12 12 12 18 Q12 12 6 12 Q12 12 12 6 Z" fill="#7fe0d6" opacity=".55"/>
      <circle cx="37" cy="34" r="1.6" fill="#b9f3ec" opacity=".7"/>
      <circle cx="30" cy="9" r="1" fill="#ffffff" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="250" height="350" rx="16" fill="url(#sky)"/>
  <rect width="250" height="350" rx="16" fill="url(#stars)"/>
  <rect x="9" y="9" width="232" height="332" rx="11" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="17" y="17" width="216" height="316" rx="8" fill="none" stroke="#e2b44d" stroke-width="1.2" opacity=".6"/>
  <g transform="translate(125 175)">
    <circle r="62" fill="none" stroke="#e2b44d" stroke-width="2" opacity=".55"/>
    <circle r="48" fill="#12153a" stroke="url(#gold)" stroke-width="3"/>
    <path d="M0 -78 L14 -14 L78 0 L14 14 L0 78 L-14 14 L-78 0 L-14 -14 Z" fill="url(#gold)" opacity=".9"/>
    <path d="M0 -40 L24 0 L0 40 L-24 0 Z" fill="#2b2f6b" stroke="#fff0b8" stroke-width="2"/>
    <path d="M0 -24 L13 0 L0 24 L-13 0 Z" fill="#7fe0d6"/>
  </g>
  <g fill="#e2b44d" opacity=".8">
    <path d="M125 30 l6 10 -6 10 -6 -10z"/><path d="M125 300 l6 10 -6 10 -6 -10z"/>
  </g>
</svg>
